<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeHuang 导航 · 个人起始页</title>
<!-- 标准图标声明，强制指定为 SVG 任意尺寸 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d9488'/%3E%3Cpath d='M15.5 8.5 13.7 13.7 8.5 15.5 10.3 10.3Z' fill='white'/%3E%3C/svg%3E" sizes="any">
<!-- 针对 Safari 的掩码图标（用于 macOS 顶部栏和书签） -->
<link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d9488'/%3E%3Cpath d='M15.5 8.5 13.7 13.7 8.5 15.5 10.3 10.3Z' fill='white'/%3E%3C/svg%3E" color="#0d9488">

<!-- 字体：Inter（UI）+ JetBrains Mono（代码/域名/数字） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter','system-ui','-apple-system','PingFang SC','Hiragino Sans GB','Microsoft YaHei','sans-serif'],
        mono: ['JetBrains Mono','ui-monospace','SFMono-Regular','monospace'],
      },
      keyframes: {
        fadeUp:  {'0%':{opacity:'0',transform:'translateY(16px)'},'100%':{opacity:'1',transform:'translateY(0)'}},
        slideIn: {'0%':{opacity:'0',transform:'translateY(12px) scale(.97)'},'100%':{opacity:'1',transform:'translateY(0) scale(1)'}},
      },
      animation: {
        'fade-up':'fadeUp .55s cubic-bezier(.23,.68,.35,1) both',
        'slide-in':'slideIn .35s cubic-bezier(.21,1.02,.73,1) both',
      },
    }
  }
}
</script>

<style>
  html{scroll-behavior:smooth}
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#99f6e4;color:#0f766e}
  /* 全局滚动条美化 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8;border:3px solid transparent;background-clip:padding-box}
  /* 顶部抽屉式导航：固定定位（收展不影响布局高度，不产生页面跳动），
     仅在页面顶部附近展开，向下滚动超过阈值收起；40~120px 之间保持原状态（迟滞区间） */
  #topDrawer{transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .28s ease}
  #topDrawer.collapsed{transform:translateY(-100%);opacity:0;pointer-events:none}
  /* 统一按键样式 */
  .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;padding:.18rem .42rem;border:1px solid #e2e8f0;border-bottom-width:2px;background:#f8fafc;border-radius:.4rem;font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<body class="min-h-screen overflow-x-hidden font-sans bg-gradient-to-b from-[#f0fdfa] via-[#f7fdfb] to-white text-slate-800">

<!-- ============ 顶部抽屉式导航（fixed，收展不挤压内容） ============ -->
<header id="topDrawer" class="fixed top-0 inset-x-0 z-40 bg-white/70 backdrop-blur-xl border-b border-slate-200/70">
  <div class="max-w-[1280px] mx-auto px-4 sm:px-6 h-14 flex items-center gap-3">
    <a href="#" class="flex items-center gap-2.5 shrink-0" aria-label="KeHuang 导航">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-400 to-teal-600 text-white flex items-center justify-center shadow-md shadow-teal-600/25">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg>
      </span>
      <span class="leading-tight">
        <span class="block font-bold text-slate-800 text-[15px]">KeHuang 导航</span>
        <span class="block text-[10px] font-mono text-teal-600/80 tracking-widest">KEHUANG.EU.ORG</span>
      </span>
    </a>
  </div>
</header>

<main class="relative max-w-[1280px] mx-auto px-4 sm:px-6 pt-14">

  <!-- ============ Hero：问候 + 时钟 + 搜索 ============ -->
  <section class="relative pt-10 sm:pt-14 pb-20 sm:pb-28">
    <!-- 氛围光斑（自裁剪，不影响下拉层） -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      <div class="absolute -top-24 left-[10%] w-[28rem] h-[28rem] rounded-full bg-teal-200/25 blur-3xl"></div>
      <div class="absolute top-20 right-[6%] w-96 h-96 rounded-full bg-cyan-200/25 blur-3xl"></div>
    </div>

    <div class="relative z-10 text-center">
      <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-white/85 border border-teal-100 shadow-sm text-[15px] sm:text-base text-teal-700 font-semibold">
        <span class="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
        <span id="dateText">——</span>
      </div>

      <h1 class="mt-6 flex items-center justify-center gap-3 text-4xl sm:text-[44px] font-extrabold tracking-tight text-slate-800">
        <span id="greetIcon"></span><span id="greetText">你好</span>
      </h1>

      <div class="mt-3 flex items-baseline justify-center font-mono tabular-nums">
        <span id="clockMain" class="text-5xl font-bold tracking-tight text-slate-800">00:00</span>
        <span id="clockSec" class="text-xl font-semibold text-teal-500">:00</span>
      </div>

      <!-- 搜索框：浅色底、聚焦青色边框 + 发光环 -->
      <form id="searchForm" class="relative max-w-2xl mx-auto mt-9" autocomplete="off">
        <div class="flex items-center gap-1 bg-white/95 border border-slate-200 rounded-2xl h-[58px] pl-1.5 pr-1.5 shadow-[0_2px_12px_-4px_rgba(15,23,42,.08)] transition-all duration-300 focus-within:border-teal-500 focus-within:ring-4 focus-within:ring-teal-500/15 focus-within:shadow-[0_10px_32px_-8px_rgba(13,148,136,.28)]">
          <!-- 搜索引擎切换 -->
          <button type="button" id="engineBtn" class="flex items-center gap-1.5 px-3 h-11 rounded-xl text-[13px] font-medium text-slate-600 hover:bg-teal-50 hover:text-teal-700 transition-colors shrink-0">
            <span id="engineDot" class="w-2 h-2 rounded-full bg-cyan-500"></span>
            <span id="engineName">必应</span>
            <span id="engineChev" class="text-slate-400 transition-transform duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </button>
          <span class="w-px h-6 bg-slate-200 shrink-0"></span>
          <input id="searchInput" type="text" aria-label="搜索或输入网址" placeholder="在必应中搜索，或输入网址直达…"
                 class="flex-1 h-full min-w-0 bg-transparent outline-none text-[15px] text-slate-700 placeholder:text-slate-400">
          <span class="hidden md:inline-flex items-center gap-1 mr-1 shrink-0"><kbd class="kbd">Ctrl</kbd><kbd class="kbd">K</kbd></span>
          <button type="submit" class="h-11 px-4 sm:px-5 rounded-xl bg-gradient-to-r from-teal-500 to-teal-600 text-white text-sm font-medium shadow-md shadow-teal-600/25 hover:shadow-lg hover:shadow-teal-600/30 hover:-translate-y-0.5 active:translate-y-0 transition-all shrink-0 inline-flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="w-4 h-4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span class="hidden sm:inline">搜索</span>
          </button>
        </div>
        <!-- 引擎下拉菜单 -->
        <div id="engineMenu" class="absolute left-0 top-[calc(100%+10px)] w-60 bg-white border border-slate-200/90 rounded-2xl shadow-2xl shadow-slate-900/10 p-1.5 z-30 origin-top-left scale-95 opacity-0 pointer-events-none transition-all duration-200"></div>
        <!-- 搜索建议 / 历史记录 -->
        <div id="sugBox" class="hidden absolute left-0 right-0 top-[calc(100%+10px)] bg-white border border-slate-200/90 rounded-2xl shadow-2xl shadow-slate-900/10 py-1.5 z-30 overflow-hidden"></div>
      </form>
    </div>
  </section>

  <!-- ============ 站点卡片 ============ -->
  <section class="pb-24">
    <div class="flex items-end justify-between mb-5">
      <div>
        <h2 class="flex items-center gap-2.5 text-lg font-bold text-slate-800">
          <span class="w-1 h-5 rounded-full bg-gradient-to-b from-teal-400 to-teal-600"></span>
          <span>全部站点</span>
          <span id="secCount" class="text-xs font-mono font-medium text-teal-700 bg-teal-50 border border-teal-100 rounded-full px-2 py-0.5">0</span>
        </h2>
        <p class="mt-1.5 text-[13px] text-slate-400 ml-3.5">精心整理的常用工具集合</p>
      </div>
      <div class="hidden sm:flex items-center gap-1.5 text-xs text-slate-400 pb-0.5">
        按 <kbd class="kbd">1</kbd> – <kbd class="kbd">9</kbd> 快速打开站点
      </div>
    </div>
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
  </section>
</main>

<!-- Toast 容器 -->
<div id="toastBox" class="fixed bottom-6 right-6 z-[60] flex flex-col items-end gap-2"></div>

<script>
/* ================================================================
 * 数据定义
 * ================================================================ */

// 图标工厂：统一的 Lucide 风格线性 SVG
const SVG = (inner, extra='') => (cls='w-5 h-5') =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}" ${extra}>${inner}</svg>`;

const ICONS = {
  wrench:     SVG('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'),
  pencil:     SVG('<path d="M21.17 6.83a2.83 2.83 0 0 0-4-4L3 16.99V21h4.01z"/><path d="m15 5 4 4"/>'),
  fileText:   SVG('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>'),
  checkSquare:SVG('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8.5 12.5 2.5 2.5 5-5.5"/>'),
  sliders:    SVG('<path d="M3 5h7"/><path d="M15 5h6"/><circle cx="12" cy="5" r="2"/><path d="M3 12h4"/><path d="M13 12h8"/><circle cx="10" cy="12" r="2"/><path d="M3 19h11"/><path d="M19 19h2"/><circle cx="16" cy="19" r="2"/>'),
  type:       SVG('<path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/>'),
  fileEdit:   SVG('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/><path d="M11.5 13.5 15 10l1.5 1.5-3.5 3.5-2 .5z"/>'),
  grid3x3:    SVG('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>'),
  music:      SVG('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
  droplet:    SVG('<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>'),
  bookOpen:   SVG('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),
  gamepad:    SVG('<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59c-.01.05-.02.1-.03.16C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41a2 2 0 0 1 1.42-.59h4.34a2 2 0 0 1 1.42.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.54-.6-6.58-.67-7.25-.01-.05-.02-.11-.03-.16A4 4 0 0 0 17.32 5z"/>'),
  globe:      SVG('<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'),
  search:     SVG('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>'),
  check:      SVG('<path d="M20 6 9 17l-5-5"/>'),
  clock:      SVG('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
  arrowUpRight:SVG('<path d="M7 17 17 7"/><path d="M7 7h10v10"/>'),
  sun:        SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'),
  moon:       SVG('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
};

// 站点数据（12 个网址）
const SITES = [
  { id:'tool',    name:'工具集',     url:'https://tool.kehuang.eu.org',        icon:'wrench',      color:'teal' },
  { id:'note',    name:'云笔记',     url:'https://note.kehuang.eu.org',        icon:'pencil',      color:'sky' },
  { id:'note4',   name:'笔记 Pro',   url:'https://note4.kehuang.eu.org',       icon:'fileText',    color:'indigo' },
  { id:'todo',    name:'待办清单',   url:'https://todo.kehuang.eu.org',        icon:'checkSquare', color:'emerald' },
  { id:'config',  name:'配置中心',   url:'https://config.kehuang.eu.org',      icon:'sliders',     color:'slate' },
  { id:'text',    name:'文本处理',   url:'https://text.kehuang.eu.org',        icon:'type',        color:'amber' },
  { id:'rename',  name:'批量重命名', url:'https://renamefile.kehuang.eu.org',  icon:'fileEdit',    color:'orange' },
  { id:'flac',    name:'音频转换',   url:'https://flac.kehuang.eu.org',        icon:'music',       color:'cyan' },
  { id:'shuiyin', name:'图片水印',   url:'https://shuiyin.kehuang.eu.org',     icon:'droplet',     color:'blue' },
  { id:'read',    name:'在线阅读',   url:'https://read.kehuang.eu.org',        icon:'bookOpen',    color:'violet' },
  { id:'sudu',    name:'数独游戏',   url:'https://sudu.kehuang.eu.org',        icon:'grid3x3',     color:'rose' },
  { id:'game',    name:'游戏大厅',   url:'https://game.kehuang.eu.org',        icon:'gamepad',     color:'fuchsia' },
];

// 从站点数据提取显示用域名（内置站点与自定义站点通用）
const domainOf = s => s.domain || (()=>{ try{ return new URL(s.url).hostname }catch(e){ return s.url } })();

// 搜索引擎（必应为默认）
const ENGINES = {
  bing:   { name:'必应', full:'必应搜索',  dot:'bg-cyan-500',   hint:'Bing · 默认引擎', make:q=>`https://www.bing.com/search?q=${encodeURIComponent(q)}` },
  google: { name:'Google', full:'谷歌搜索', dot:'bg-blue-500',  hint:'global search',    make:q=>`https://www.google.com/search?q=${encodeURIComponent(q)}` },
  baidu:  { name:'百度', full:'百度搜索',  dot:'bg-blue-600',   hint:'中文搜索',         make:q=>`https://www.baidu.com/s?wd=${encodeURIComponent(q)}` },
  ddg:    { name:'DuckDuckGo', full:'DuckDuckGo', dot:'bg-orange-500', hint:'注重隐私',   make:q=>`https://duckduckgo.com/?q=${encodeURIComponent(q)}` },
  site:   { name:'本站内', full:'站内搜索', dot:'bg-teal-600',   hint:'site:kehuang.eu.org', make:q=>`https://www.bing.com/search?q=${encodeURIComponent('site:kehuang.eu.org '+q)}` },
};

/* ================================================================
 * 工具函数与状态
 * ================================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// 初始化状态（含本地数据安全校验）
const state = {
  engine: ENGINES[store.get('kh_engine','bing')] ? store.get('kh_engine','bing') : 'bing',
  customs: (store.get('kh_customs',[])||[]).filter(s => s && s.name && s.url).map(s => ({
    ...s, custom:true, icon:'globe',
    color:s.color || 'teal',
    domain:s.domain || (()=>{ try{ return new URL(s.url).hostname }catch(e){ return s.url } })(),
  })),
  history: (store.get('kh_history',[])||[]).filter(x => typeof x === 'string').slice(0,10),
  list: [],
};

// DOM 引用
const grid=$('grid'), toastBox=$('toastBox');
const input=$('searchInput'), searchForm=$('searchForm'), sugBox=$('sugBox');
const engineBtn=$('engineBtn'), engineMenu=$('engineMenu'), engineDot=$('engineDot'), engineName=$('engineName'), engineChev=$('engineChev');

/* ================================================================
 * 渲染：站点卡片（紧凑横排：左图标 · 右名称 · 下网址）
 * ================================================================ */
function cardHTML(s, i){
  return `
  <div class="group relative flex items-center gap-3.5 bg-white rounded-2xl border border-slate-200/80 pl-4 pr-3.5 py-3 shadow-[0_1px_2px_rgba(15,23,42,.04)] hover:shadow-[0_12px_24px_-12px_rgba(13,148,136,.28)] hover:-translate-y-1 hover:border-${s.color}-300/70 transition-all duration-300 animate-fade-up" style="animation-delay:${Math.min(i,12)*45}ms">
    <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" class="absolute inset-0 rounded-2xl z-[1] focus-visible:ring-2 focus-visible:ring-teal-500/50" aria-label="在新标签页打开 ${esc(s.name)}"></a>
    <div class="relative z-[2] flex items-center gap-3.5 w-full min-w-0 pointer-events-none">
      <div class="w-10 h-10 rounded-xl bg-${s.color}-50 text-${s.color}-600 flex items-center justify-center shrink-0 transition-all duration-300 group-hover:scale-110 group-hover:-rotate-6 group-hover:bg-${s.color}-100">
        ${(ICONS[s.icon]||ICONS.globe)('w-5 h-5')}
      </div>
      <div class="min-w-0 flex-1 text-left">
        <h3 class="font-semibold text-slate-800 text-[15px] truncate group-hover:text-teal-700 transition-colors duration-300">${esc(s.name)}</h3>
        <p class="mt-0.5 font-mono text-xs text-slate-400 truncate">${esc(domainOf(s))}</p>
      </div>
      <span class="text-slate-300 group-hover:text-teal-500 transition-all duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 shrink-0">${ICONS.arrowUpRight('w-4 h-4')}</span>
      ${s.custom?`<button type="button" data-del="${s.id}" title="删除" aria-label="删除该网址" class="pointer-events-auto w-8 h-8 -mr-1 rounded-lg flex items-center justify-center text-slate-300 opacity-0 group-hover:opacity-100 hover:text-rose-500 hover:bg-rose-50 focus-visible:opacity-100 transition-all duration-200 shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>`:''}
    </div>
  </div>`;
}

function renderGrid(){
  const all = [...SITES, ...state.customs];
  state.list = all;
  $('secCount').textContent = all.length;
  grid.innerHTML = all.map((s,i)=>cardHTML(s,i)).join('');
}

/* ================================================================
 * 时钟与问候
 * ================================================================ */
let lastGreet = '';
function updateClock(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  $('clockMain').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
  $('clockSec').textContent  = ':' + p(d.getSeconds());
  $('dateText').textContent  = `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${'日一二三四五六'[d.getDay()]}`;
  const h = d.getHours();
  let g, ic, cl;
  if(h>=5 && h<9){ g='早上好'; ic='sun';  cl='text-amber-400'; }
  else if(h<12)   { g='上午好'; ic='sun';  cl='text-amber-400'; }
  else if(h<14)   { g='中午好'; ic='sun';  cl='text-amber-400'; }
  else if(h<18)   { g='下午好'; ic='sun';  cl='text-amber-400'; }
  else if(h<23)   { g='晚上好'; ic='moon'; cl='text-indigo-400'; }
  else            { g='夜深了'; ic='moon'; cl='text-indigo-400'; }
  if(g !== lastGreet){
    lastGreet = g;
    $('greetText').textContent = g;
    $('greetIcon').innerHTML = ICONS[ic](`w-7 h-7 sm:w-8 sm:h-8 ${cl}`);
  }
}

/* ================================================================
 * Toast 通知（支持撤销等操作按钮）
 * ================================================================ */
function toast(msg, action){
  const el = document.createElement('div');
  el.className = 'flex items-center gap-2.5 pl-3.5 pr-2 py-2.5 bg-white/95 backdrop-blur border border-slate-200 shadow-xl shadow-slate-900/5 rounded-xl text-sm animate-slide-in transition-all duration-300';
  el.innerHTML = `<span class="w-6 h-6 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center shrink-0">${ICONS.check('w-3.5 h-3.5')}</span><span class="text-slate-600">${msg}</span>`;
  const dismiss = () => { el.classList.add('opacity-0','translate-y-2'); setTimeout(()=>el.remove(), 320); };
  if(action){
    const btn = document.createElement('button');
    btn.type='button';
    btn.className='px-2.5 py-1 rounded-lg text-teal-600 font-medium hover:bg-teal-50 transition-colors text-[13px] shrink-0';
    btn.textContent = action.label;
    btn.onclick = () => { action.fn(); dismiss(); };
    el.appendChild(btn);
  }
  toastBox.appendChild(el);
  setTimeout(dismiss, action ? 5000 : 2600);
}

/* ================================================================
 * 搜索：引擎切换 / 必应联想(JSONP) / 历史 / URL 直达
 * ================================================================ */
function looksLikeUrl(q){
  if(!q || /\s/.test(q)) return false;
  return /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}([/?#/:].*)?$/i.test(q);
}

let sugTimer = null, sugSeq = 0, lastQuery = '', sugList = [], sugActive = -1;

function showSugBox(){ sugBox.classList.remove('hidden'); }
function hideSugBox(){ sugBox.classList.add('hidden'); sugActive = -1; }

function highlight(text, q){
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx < 0) return esc(text);
  return esc(text.slice(0,idx)) + '<span class="text-teal-700 font-medium">' + esc(text.slice(idx, idx+q.length)) + '</span>' + esc(text.slice(idx+q.length));
}

function sugItemHTML(it, i, q){
  const active = i === sugActive;
  let label;
  if(it.type === 'url')  label = `<span class="font-medium text-teal-700">${esc(it.label)}</span>`;
  else if(it.type==='hist') label = `<span class="text-slate-700">${esc(it.label)}</span>`;
  else label = highlight(it.label, q);
  const icon = it.type==='hist' ? ICONS.clock('w-4 h-4') : it.type==='url' ? ICONS.arrowUpRight('w-4 h-4') : ICONS.search('w-4 h-4');
  return `<div data-sug="${i}" class="mx-1.5 flex items-center gap-3 px-2.5 h-10 rounded-lg cursor-pointer text-sm transition-colors ${active?'bg-teal-50':'hover:bg-teal-50/60'}">
    <span class="text-slate-400 shrink-0 flex">${icon}</span>
    <span class="flex-1 truncate">${label}</span>
    ${it.type==='url'?'<span class="text-[11px] font-medium text-teal-500 shrink-0">Enter 直达</span>':''}
    ${it.type==='hist'?`<button type="button" data-delhist="${i}" title="删除该条记录" class="w-6 h-6 rounded-md flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-colors shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" class="w-3.5 h-3.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>`:''}
  </div>`;
}

function renderSugBox(q){
  if(!sugList.length){ hideSugBox(); return; }
  const isHist = sugList[0].type === 'hist';
  sugBox.innerHTML = `
    <div class="px-5 pt-3 pb-1.5 text-[11px] font-medium text-slate-400 tracking-wide">${isHist?'搜索历史':'搜索建议'}</div>
    ${sugList.map((it,i)=>sugItemHTML(it,i,q)).join('')}
    ${isHist && state.history.length ? `<div class="border-t border-slate-100 mt-1 pt-1 px-3 pb-1.5"><button type="button" data-clearhist class="text-xs text-slate-400 hover:text-rose-500 px-2 py-1.5 rounded-lg hover:bg-rose-50 transition-colors">清空历史</button></div>`:''}`;
  showSugBox();
}

function buildSug(q, bingList){
  sugList = []; sugActive = -1;
  if(looksLikeUrl(q)) sugList.push({ type:'url', label:q, action:()=>openUrl(q) });
  (bingList||[]).forEach(t => sugList.push({ type:'sug', label:t, action:()=>doSearch(t) }));
  renderSugBox(q);
}

function buildHistory(){
  sugList = state.history.slice(0,8).map(t => ({ type:'hist', label:t, action:()=>{ input.value = t; doSearch(t); } }));
  renderSugBox('');
}

// 必应搜索联想（JSONP 方式请求，失败静默降级，不影响主功能）
function requestSug(q){
  const seq = ++sugSeq, cb = '__khSug' + seq;
  const script = document.createElement('script');
  let done = false;
  const timer = setTimeout(()=>{ if(done) return; done = true; cleanup(); if(seq === sugSeq) hideSugBox(); }, 3500);
  function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){} script.remove(); }
  window[cb] = data => {
    if(done || seq !== sugSeq) return;
    done = true; cleanup();
    let list = [];
    try{ list = (data.AS.Results[0].Suggests || []).map(s => s.Txt).filter(Boolean); }catch(e){}
    list = list.filter(t => t.toLowerCase() !== q.toLowerCase()).slice(0,8);
    buildSug(q, list);
  };
  script.onerror = () => { if(done) return; done = true; cleanup(); if(seq === sugSeq) hideSugBox(); };
  // 加载态
  sugList = []; sugActive = -1;
  sugBox.innerHTML = `<div class="flex items-center gap-3 px-5 h-11 text-sm text-slate-400"><span class="w-4 h-4 border-2 border-teal-200 border-t-teal-500 rounded-full animate-spin"></span>正在获取搜索建议…</div>`;
  showSugBox();
  script.src = 'https://api.bing.com/qsonhs.aspx?type=cb&q=' + encodeURIComponent(q) + '&cb=' + cb;
  document.head.appendChild(script);
}

function pushHistory(t){
  state.history = state.history.filter(x => x !== t);
  state.history.unshift(t);
  state.history = state.history.slice(0,10);
  store.set('kh_history', state.history);
}

function openUrl(u){
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  pushHistory(u);
  window.open(u, '_blank');
  input.value = ''; hideSugBox(); input.blur();
}

function doSearch(term){
  term = (term || '').trim();
  if(!term) return;
  pushHistory(term);
  window.open(ENGINES[state.engine].make(term), '_blank');
  input.value = ''; hideSugBox(); input.blur();
}

// ---- 搜索框事件 ----
input.addEventListener('input', () => {
  const q = input.value;
  if(!q.trim()){ document.activeElement === input && state.history.length ? buildHistory() : hideSugBox(); return; }
  lastQuery = q;
  clearTimeout(sugTimer);
  if(looksLikeUrl(q)){ buildSug(q, []); return; }   // URL 直达，无需联想
  sugTimer = setTimeout(() => requestSug(q), 260);  // 防抖请求联想
});
input.addEventListener('focus', () => { if(!input.value.trim() && state.history.length) buildHistory(); });
input.addEventListener('keydown', e => {
  const open = !sugBox.classList.contains('hidden') && sugList.length;
  if(open){
    if(e.key === 'ArrowDown'){ e.preventDefault(); sugActive = (sugActive+1) % sugList.length; renderSugBox(lastQuery); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); sugActive = (sugActive-1+sugList.length) % sugList.length; renderSugBox(lastQuery); }
    else if(e.key === 'Enter' && sugActive >= 0){ e.preventDefault(); sugList[sugActive].action(); }
    else if(e.key === 'Escape'){ hideSugBox(); }
  } else if(e.key === 'Escape'){ input.blur(); }
});
searchForm.addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value.trim();
  if(!q) return;
  looksLikeUrl(q) ? openUrl(q) : doSearch(q);
});
// 下拉区域按住鼠标时不让输入框失焦，保证点击顺畅
sugBox.addEventListener('mousedown', e => e.preventDefault());
sugBox.addEventListener('click', e => {
  const dh = e.target.closest('[data-delhist]');
  if(dh){ state.history.splice(+dh.dataset.delhist, 1); store.set('kh_history', state.history); buildHistory(); return; }
  if(e.target.closest('[data-clearhist]')){ state.history = []; store.set('kh_history', []); hideSugBox(); toast('已清空搜索历史'); return; }
  const it = e.target.closest('[data-sug]');
  if(it && sugList[+it.dataset.sug]) sugList[+it.dataset.sug].action();
});

// ---- 引擎切换 ----
function setMenuOpen(open){
  engineMenu.classList.toggle('opacity-0', !open);
  engineMenu.classList.toggle('scale-95', !open);
  engineMenu.classList.toggle('pointer-events-none', !open);
  engineChev.classList.toggle('rotate-180', open);
}
function renderEngineMenu(){
  engineMenu.innerHTML = Object.entries(ENGINES).map(([k,e]) => `
    <button type="button" data-engine="${k}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition-colors ${k===state.engine?'bg-teal-50/80':'hover:bg-slate-50'}">
      <span class="w-2 h-2 rounded-full ${e.dot} shrink-0"></span>
      <span class="flex-1 min-w-0">
        <span class="block text-sm font-medium ${k===state.engine?'text-teal-700':'text-slate-700'}">${e.full}</span>
        <span class="block text-[11px] font-mono text-slate-400 truncate">${e.hint}</span>
      </span>
      ${k===state.engine?`<span class="text-teal-600 shrink-0">${ICONS.check('w-4 h-4')}</span>`:''}
    </button>`).join('');
}
function setEngine(k){
  if(!ENGINES[k]) return;
  state.engine = k;
  store.set('kh_engine', k);
  const e = ENGINES[k];
  engineDot.className = `w-2 h-2 rounded-full ${e.dot}`;
  engineName.textContent = e.name;
  input.placeholder = `在${e.full}中搜索，或输入网址直达…`;
  renderEngineMenu();
}
engineBtn.addEventListener('click', e => { e.stopPropagation(); setMenuOpen(engineMenu.classList.contains('opacity-0')); });
engineMenu.addEventListener('mousedown', e => e.preventDefault());
engineMenu.addEventListener('click', e => {
  const b = e.target.closest('[data-engine]');
  if(!b) return;
  setEngine(b.dataset.engine);
  setMenuOpen(false);
});
document.addEventListener('click', e => {
  if(!e.target.closest('#searchForm')){ hideSugBox(); setMenuOpen(false); }
});

/* ================================================================
 * 删除自定义站点 / 卡片事件委托
 * ================================================================ */
function delCustom(id){
  const idx = state.customs.findIndex(s => s.id === id);
  if(idx < 0) return;
  const [item] = state.customs.splice(idx, 1);
  store.set('kh_customs', state.customs);
  renderGrid();
  toast(`已删除「${esc(item.name)}」`, { label:'撤销', fn:()=>{
    state.customs.splice(Math.min(idx, state.customs.length), 0, item);
    store.set('kh_customs', state.customs);
    renderGrid();
  }});
}

grid.addEventListener('click', e => {
  const delB = e.target.closest('[data-del]');
  if(delB){ e.preventDefault(); e.stopPropagation(); delCustom(delB.dataset.del); }
});

/* ================================================================
 * 全局快捷键
 * ================================================================ */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); input.focus(); input.select(); return; }
  if(e.key === 'Escape'){
    if(typing){ hideSugBox(); input.blur(); }
    return;
  }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === '/'){ e.preventDefault(); input.focus(); }
  else if(/^[1-9]$/.test(e.key)){
    const s = state.list[+e.key - 1];
    if(s) window.open(s.url, '_blank');
  }
});

/* ================================================================
 * 顶部抽屉导航：仅在页面顶部附近展开
 * - fixed 定位：收起/展开只做位移，不改变文档流高度，页面不会跳动
 * - 迟滞阈值：滚动 < 40px 展开，> 120px 收起，中间区间保持当前状态
 * ================================================================ */
const topDrawer = $('topDrawer');
let drawerRAF = false;
function syncDrawer(){
  drawerRAF = false;
  const y = window.scrollY;
  if(y <= 40)      topDrawer.classList.remove('collapsed');
  else if(y >= 120) topDrawer.classList.add('collapsed');
}
window.addEventListener('scroll', () => {
  if(!drawerRAF){ drawerRAF = true; requestAnimationFrame(syncDrawer); }
}, { passive:true });

// 启动
syncDrawer();
setEngine(state.engine);
renderGrid();
updateClock();
setInterval(updateClock, 1000);
</script>
